<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Présence au bureau</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Présence">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#6366f1">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef0f8;
    --card: #ffffff;
    --text: #1a1a2e;
    --muted: #6b6b8a;
    --border: rgba(26,26,46,.09);
    --shadow: 0 2px 12px rgba(26,26,46,.08);
    --shadow-lg: 0 8px 32px rgba(26,26,46,.12);
    --radius: 20px;
    --pill: 999px;
    --accent: #6366f1;
    --accent-soft: rgba(99,102,241,.10);
    --accent-mid: rgba(99,102,241,.25);
    --today-bg: rgba(99,102,241,.07);
    --today-border: rgba(99,102,241,.30);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, #e8eaf6 0%, #ede7f6 40%, #e3f2fd 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  /* fallback pour mobile */
  @supports not (background-attachment: fixed) {
    body { background: linear-gradient(135deg, #e8eaf6 0%, #ede7f6 40%, #e3f2fd 100%) center / cover no-repeat; }
  }

  /* subtle grid texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(99,102,241,.05) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

  /* ── TOPBAR ── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    box-shadow: var(--shadow);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: -0.03em;
    color: var(--text);
  }

  .brand-icon {
    width: 36px; height: 36px;
    background: #6366f1;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 2px 8px rgba(99,102,241,.35);
  }

  .spacer { flex: 1; }

  .btn {
    border: 1px solid var(--border);
    background: #fff;
    padding: 9px 14px;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    transition: all .12s ease;
    white-space: nowrap;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background: #f8faf8; box-shadow: var(--shadow); }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn.accent { background: var(--accent-soft); border-color: var(--accent-mid); color: var(--accent); }
  .btn.accent:hover { background: rgba(22,163,74,.15); }

  .select {
    border: 1px solid var(--border);
    padding: 9px 14px;
    border-radius: 12px;
    background: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
  }

  /* ── PROFILE CARD ── */
  .profile-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    margin-top: 10px;
  }

  .profile-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 2px solid rgba(99,102,241,.30);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 15px;
    color: #6366f1;
    flex-shrink: 0;
  }

  .profile-name { font-weight: 700; font-size: 15px; }
  .profile-sub { font-size: 13px; color: var(--muted); }

  .name-form {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .name-form.visible { display: flex; }

  input[type="text"] {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    background: #f8faf8;
    flex: 1;
    min-width: 160px;
    outline: none;
    transition: border-color .12s;
  }
  input[type="text"]:focus { border-color: var(--accent); background: #fff; }

  /* ── MAIN CARD ── */
  .main-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
    margin-top: 10px;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .range-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    font-family: 'DM Mono', monospace;
  }

  /* ── KPI CHIPS ── */
  .kpi-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 12px;
  }

  .kpi {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: var(--pill);
    border: 1px solid var(--border);
    background: #f8faf8;
    font-size: 13px;
    font-weight: 600;
  }
  .kpi .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  .last-updated { display: none; }

  /* ── DAYS LIST ── */
  .days-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }

  /* ── DAY PILL ── */
  .day-pill {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    background: #fff;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: box-shadow .12s ease, transform .06s ease;
  }
  .day-pill:hover { box-shadow: var(--shadow-lg); }
  .day-pill.today {
    background: var(--today-bg);
    border-color: var(--today-border);
    box-shadow: 0 4px 20px rgba(99,102,241,.10);
  }

  .day-label {
    font-weight: 800;
    font-size: 14px;
    letter-spacing: -0.02em;
    min-width: 170px;
    flex-shrink: 0;
  }
  .day-label .day-num {
    display: block;
    font-size: 22px;
    line-height: 1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    font-weight: 800;
  }
  .day-label .day-name { display: none; }
  .day-label .day-date {
    display: block;
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-top: 3px;
    font-weight: 500;
  }

  /* TODAY badge */
  .today-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent-mid);
    border-radius: var(--pill);
    padding: 2px 8px;
    margin-top: 4px;
  }

  /* chips */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }

  .chip {
    border-radius: var(--pill);
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid transparent;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: transform .06s ease;
  }
  .chip:active { transform: scale(.98); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .chip.empty { color: var(--muted); font-weight: 400; font-size: 13px; background: none; border: none; padding: 6px 0; }

  /* big toggle */
  .big-toggle {
    border-radius: 14px;
    padding: 10px 16px;
    font-weight: 700;
    font-size: 13px;
    border: 1px solid var(--accent-mid);
    background: var(--accent-soft);
    color: var(--accent);
    cursor: pointer;
    user-select: none;
    transition: all .12s ease;
    white-space: nowrap;
    flex-shrink: 0;
    font-family: 'DM Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .big-toggle:hover { background: rgba(99,102,241,.16); box-shadow: 0 4px 14px rgba(99,102,241,.20); }
  .big-toggle:active { transform: translateY(1px) scale(.99); }
  .big-toggle.off {
    border-color: var(--border);
    background: #f8faf8;
    color: var(--muted);
  }
  .big-toggle.off:hover { background: #f0f2f0; color: var(--text); }

  /* status msg */
  .msg {
    font-size: 13px;
    color: var(--muted);
    margin-top: 12px;
    min-height: 20px;
    font-family: 'DM Mono', monospace;
  }

  /* ── MOBILE ── */
  @media (max-width: 680px) {
    body { padding: 12px 10px 40px; }

    .brand { font-size: 14px; }
    .topbar { padding: 10px 12px; gap: 6px; flex-wrap: nowrap; }
    .topbar .spacer { display: none; }
    .select { font-size: 13px; padding: 8px 8px; flex-shrink: 0; }
    .btn { font-size: 13px; padding: 8px 10px; flex-shrink: 0; }
    #refresh { display: none; }

    .day-pill {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      padding: 18px;
      border-radius: 20px;
    }

    .day-label { min-width: auto; }
    .day-label .day-num { font-size: 28px; }

    .chips {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip { font-size: 14px; padding: 8px 12px; }

    .big-toggle {
      width: 100%;
      text-align: center;
      font-size: 15px;
      padding: 14px;
      border-radius: 16px;
    }

    .last-updated { margin-left: 0; width: 100%; }
  }
</style>
</head>

async function supa(path, opts={}) {
  const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, {
    headers: {
      "apikey": SUPA_KEY,
      "Authorization": `Bearer ${SUPA_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation"
    },
    ...opts
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;

}

function getMyNameLocal() { return localStorage.getItem("_myname") || ""; }
function setMyNameLocal(n) { localStorage.setItem("_myname", n); }

// ─── API ──────────────────────────────────────────────────────────────────
async function saveMyName(name) {
  const myId = ME_KEY();

  // Ce nom existe-t-il déjà dans la base ?
  const nameExists = await supa(`users?name=eq.${encodeURIComponent(name)}&select=id`);

  if (nameExists && nameExists.length > 0) {
    // Le nom existe → on adopte son id (sync inter-appareils)
    localStorage.setItem("_uid", nameExists[0].id);
  } else {
    // Mon id existe-t-il déjà ?
    const meExists = await supa(`users?id=eq.${myId}&select=id`);
    if (meExists && meExists.length > 0) {
      // Je renomme → PATCH
      await supa(`users?id=eq.${myId}`, {
        method: "PATCH",
        prefer: "return=representation",
        body: JSON.stringify({ name })
      });
    } else {
      // Nouveau → INSERT
      await supa("users", {
        method: "POST",
        prefer: "return=representation",
        body: JSON.stringify({ id: myId, name })
      });
    }
  }
  setMyNameLocal(name);
}

async function loadViewData(startISO, endISO) {
  const rows = await supa(`presence?day=gte.${startISO}&day=lte.${endISO}&select=day,user_id,status,users(name)`);
  const byDay = {};
  const myByDay = {};
  for (const r of rows) {
    const day = r.day;
    const name = r.users?.name || "(Sans nom)";
    const status = r.status;
    const uid = r.user_id;
    if (uid === ME_KEY) myByDay[day] = status;
    if (status === "PRESENT") {
      if (!byDay[day]) byDay[day] = [];
      byDay[day].push(name);
    }
  }
  Object.keys(byDay).forEach(d => byDay[d].sort((a,b) => a.localeCompare(b,"fr")));
  return { byDay, myByDay };
}

async function toggleDay(dayISO) {
  const rows = await supa(`presence?day=eq.${dayISO}&user_id=eq.${ME_KEY()}&select=status`);
  const current = rows?.[0]?.status || "";
  const next = current === "PRESENT" ? "ABSENT" : "PRESENT";

  if (rows && rows.length > 0) {
    // La ligne existe → on la met à jour avec PATCH
    await supa(`presence?day=eq.${dayISO}&user_id=eq.${ME_KEY()}`, {
      method: "PATCH",
      prefer: "return=representation",
      body: JSON.stringify({ status: next, updated_at: new Date().toISOString() })
    });
  } else {
    // La ligne n'existe pas → on l'insère
    await supa("presence", {
      method: "POST",
      prefer: "return=representation",
      body: JSON.stringify({ user_id: ME_KEY(), day: dayISO, status: next, updated_at: new Date().toISOString() })
    });
  }
  return next;
}

async function setAllPresent(days) {
  for (const d of days) {
    const existing = await supa(`presence?day=eq.${d}&user_id=eq.${ME_KEY()}&select=status`);
    if (existing && existing.length > 0) {
      await supa(`presence?day=eq.${d}&user_id=eq.${ME_KEY()}`, {
        method: "PATCH",
        prefer: "return=representation",
        body: JSON.stringify({ status: "PRESENT", updated_at: new Date().toISOString() })
      });
    } else {
      await supa("presence", {
        method: "POST",
        prefer: "return=representation",
        body: JSON.stringify({ user_id: ME_KEY(), day: d, status: "PRESENT", updated_at: new Date().toISOString() })
      });
    }
  }
}

async function copyPrev(currentDays, prevDays) {
  const rows = await supa(`presence?day=in.(${prevDays.join(",")})&user_id=eq.${ME_KEY()}&select=day,status`);
  const map = {};
  rows.forEach(r => map[r.day] = r.status);
  for (let i = 0; i < currentDays.length; i++) {
    const st = map[prevDays[i]];
    if (!st) continue;
    const existing = await supa(`presence?day=eq.${currentDays[i]}&user_id=eq.${ME_KEY()}&select=status`);
    if (existing && existing.length > 0) {
      await supa(`presence?day=eq.${currentDays[i]}&user_id=eq.${ME_KEY()}`, {
        method: "PATCH",
        prefer: "return=representation",
        body: JSON.stringify({ status: st, updated_at: new Date().toISOString() })
      });
    } else {
      await supa("presence", {
        method: "POST",
        prefer: "return=representation",
        body: JSON.stringify({ user_id: ME_KEY(), day: currentDays[i], status: st, updated_at: new Date().toISOString() })
      });
    }
  }
}

// ─── UTILS ────────────────────────────────────────────────────────────────
function toISO(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function startOfWeekMon(d) {
  const x = new Date(d); x.setHours(0,0,0,0);
  const day = x.getDay() || 7;
  x.setDate(x.getDate() - (day-1));
  return x;
}
function isToday(dayISO) { const t = new Date(); t.setHours(0,0,0,0); return dayISO === toISO(t); }
function dayNum(d) { return d.toLocaleDateString("fr-FR", { weekday:"long" }); }
function dayMonth(d) { return d.toLocaleDateString("fr-FR", { day:"2-digit", month:"2-digit" }); }
function colorFromName(name) {
  let h = 2166136261;
  for (let i=0; i<name.length; i++) { h ^= name.charCodeAt(i); h = Math.imul(h, 16777619); }
  h = (h >>> 0) % 360;
  return { bg:`hsla(${h},65%,92%,1)`, border:`hsla(${h},50%,72%,1)`, dot:`hsla(${h},60%,45%,1)`, text:`hsla(${h},55%,20%,1)` };
}
function esc(s) { return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ─── STATE ────────────────────────────────────────────────────────────────
let start = startOfWeekMon(new Date());
let daysCount = 7;
let viewData = { byDay: {}, myByDay: {} };

// ─── UI REFS ──────────────────────────────────────────────────────────────
const daysListEl = document.getElementById("daysList");
const rangeLabel = document.getElementById("rangeLabel");
const profileName = document.getElementById("profileName");
const avatarEl = document.getElementById("avatarEl");
const nameForm = document.getElementById("nameForm");
const nameInput = document.getElementById("nameInput");
const nameMsg = document.getElementById("nameMsg");
const kpiToday = document.getElementById("kpiToday");
const kpiTomorrow = document.getElementById("kpiTomorrow");
const lastUpdated = document.getElementById("lastUpdated");
const viewDaysEl = document.getElementById("viewDays");

// ─── RENDER ───────────────────────────────────────────────────────────────
function renderUI() {
  daysCount = Number(viewDaysEl.value);
  const endDate = addDays(start, daysCount - 1);
  const fmtStart = start.toLocaleDateString("fr-FR", { day:"numeric", month:"long" });
  const fmtEnd = endDate.toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" });
  rangeLabel.textContent = `${fmtStart} → ${fmtEnd}`;

  const myName = getMyNameLocal();
  profileName.textContent = myName || "Nom non défini";
  avatarEl.textContent = myName ? myName[0].toUpperCase() : "?";

  const todayISO = toISO(new Date());
  const tomorrowISO = toISO(addDays(new Date(), 1));
  kpiToday.innerHTML = `<span class="dot"></span> Aujourd'hui&nbsp;: <b>${(viewData.byDay[todayISO]||[]).length}</b>`;
  kpiTomorrow.innerHTML = `<span class="dot"></span> Demain&nbsp;: <b>${(viewData.byDay[tomorrowISO]||[]).length}</b>`;

  daysListEl.innerHTML = "";
  for (let i = 0; i < daysCount; i++) {
    const d = addDays(start, i);
    const dayISO = toISO(d);

    // Sauter samedi (6) et dimanche (0)
    if (d.getDay() === 0 || d.getDay() === 6) continue;

    const names = viewData.byDay[dayISO] || [];
    const myStatus = viewData.myByDay[dayISO] || "";
    const today = isToday(dayISO);

    const pill = document.createElement("div");
    pill.className = "day-pill" + (today ? " today" : "");

    const chipsHtml = names.length
      ? names.map(n => {
          const c = colorFromName(n);
          return `<div class="chip" style="background:${c.bg};border-color:${c.border};color:${c.text};"><span class="dot" style="background:${c.dot}"></span>${esc(n)}</div>`;
        }).join("")
      : `<span class="chip empty">Aucun présent</span>`;

    pill.innerHTML = `
      <div class="day-label">
        <span class="day-num">${dayNum(d)}</span>
        <span class="day-date">${dayMonth(d)}</span>
        ${today ? '<span class="today-badge">● Aujourd\'hui</span>' : ""}
      </div>
      <div class="chips">${chipsHtml}</div>
      <button class="big-toggle ${myStatus === "PRESENT" ? "" : "off"}" data-day="${dayISO}">${myStatus === "PRESENT" ? "✅ Présent" : "➕ Me noter"}</button>
    `;
    daysListEl.appendChild(pill);
  }

  document.querySelectorAll(".big-toggle").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!getMyNameLocal()) { nameForm.classList.add("visible"); nameInput.focus(); return; }
      const day = btn.getAttribute("data-day");
      btn.disabled = true;
      try {
        const next = await toggleDay(day);
        viewData.myByDay[day] = next;
        const myName = getMyNameLocal();
        if (next === "PRESENT") {
          if (!viewData.byDay[day]) viewData.byDay[day] = [];
          if (!viewData.byDay[day].includes(myName)) { viewData.byDay[day].push(myName); viewData.byDay[day].sort((a,b)=>a.localeCompare(b,"fr")); }
        } else {
          if (viewData.byDay[day]) viewData.byDay[day] = viewData.byDay[day].filter(n => n !== myName);
        }
        btn.textContent = next === "PRESENT" ? "✅ Présent" : "➕ Me noter";
        btn.className = "big-toggle" + (next === "PRESENT" ? "" : " off");
        const pill = btn.closest(".day-pill");
        const chipsEl = pill.querySelector(".chips");
        const names = viewData.byDay[day] || [];
        chipsEl.innerHTML = names.length
          ? names.map(n => { const c=colorFromName(n); return `<div class="chip" style="background:${c.bg};border-color:${c.border};color:${c.text};"><span class="dot" style="background:${c.dot}"></span>${esc(n)}</div>`; }).join("")
          : `<span class="chip empty">Aucun présent</span>`;
        const todayISO = toISO(new Date());
        const tomorrowISO = toISO(addDays(new Date(), 1));
        kpiToday.innerHTML = `<span class="dot"></span> Aujourd'hui&nbsp;: <b>${(viewData.byDay[todayISO]||[]).length}</b>`;
        kpiTomorrow.innerHTML = `<span class="dot"></span> Demain&nbsp;: <b>${(viewData.byDay[tomorrowISO]||[]).length}</b>`;
      } catch(e) { }
      btn.disabled = false;
    });
  });
}

async function loadAndRender() {
  daysCount = Number(viewDaysEl.value);
  const startISO = toISO(start);
  const endISO = toISO(addDays(start, daysCount - 1));
  try {
    viewData = await loadViewData(startISO, endISO);
    renderUI();
  } catch(e) {
  }
}

// ─── EVENTS ───────────────────────────────────────────────────────────────
document.getElementById("editNameBtn").onclick = () => {
  nameForm.classList.toggle("visible");
  nameInput.value = getMyNameLocal();
  nameInput.focus();
};

document.getElementById("saveName").onclick = async () => {
  const v = nameInput.value.trim();
  if (!v) { nameMsg.textContent = "Prénom vide !"; return; }
  nameMsg.textContent = "Enregistrement…";
  try {
    await saveMyName(v);
    nameForm.classList.remove("visible");
    nameMsg.textContent = "";
    await loadAndRender();
  } catch(e) { nameMsg.textContent = "❌ " + e.message; }
};

nameInput.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("saveName").click(); });

viewDaysEl.onchange = loadAndRender;
document.getElementById("prev").onclick = () => { start = addDays(start, -daysCount); loadAndRender(); };
document.getElementById("next").onclick = () => { start = addDays(start, daysCount); loadAndRender(); };
document.getElementById("refresh").onclick = loadAndRender;

document.getElementById("weekPresent").onclick = async () => {
  if (!getMyNameLocal()) { nameForm.classList.add("visible"); return; }
  try {
    const days = Array.from({length: daysCount}, (_, i) => toISO(addDays(start, i)));
    await setAllPresent(days);
    await loadAndRender();
  } catch(e) { }
};

document.getElementById("copyPrev").onclick = async () => {
  if (!getMyNameLocal()) { nameForm.classList.add("visible"); return; }
  try {
    const curr = Array.from({length: daysCount}, (_, i) => toISO(addDays(start, i)));
    const prev = Array.from({length: daysCount}, (_, i) => toISO(addDays(start, i - daysCount)));
    await copyPrev(curr, prev);
    await loadAndRender();
  } catch(e) { }
};

// ─── INIT ─────────────────────────────────────────────────────────────────
loadAndRender();
</script>
